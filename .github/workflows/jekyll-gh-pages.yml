name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Перевірка ноутбука
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nbformat
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import glob, nbformat
          files = glob.glob("*.ipynb")
          assert files, "Не знайдено жодного .ipynb"
          for f in files:
              nbformat.validate(nbformat.read(f, as_version=4))
              print("OK:", f)
          PY

  deploy:
    name: Розгортання на GitHub Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build site
        run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="uk"><head><meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Аналізатор відгуків</title>
          <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:60px auto;padding:0 16px;color:#222}
          a.btn{display:inline-block;padding:12px 22px;background:#f9ab00;color:#000;border-radius:8px;text-decoration:none;font-weight:600}</style>
          </head><body>
          <h1>Аналізатор відгуків (ШІ)</h1>
          <p>Модель Hugging Face визначає тональність відгуків. Застосунок запускається в Google Colab.</p>
          <p><a class="btn" href="https://colab.research.google.com/github/${{ github.repository }}/blob/main/review_analyzer.ipynb">Відкрити в Google Colab</a></p>
          <p><a href="https://github.com/${{ github.repository }}">Репозиторій на GitHub</a></p>
          </body></html>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
